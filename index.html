<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BankKit — Find a zero-balance account that fits you</title>
<meta name="description" content="Compare 8 Indian savings accounts, find your zero-balance match in 4 questions, and see exactly what your money earns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ead9; --cream:#fffdf7; --ink:#241a12; --ink2:#5c4a38;
  --ink3:#8a7661; --bronze:#a4762a; --bronze-d:#7d5a1e; --gold:#d9a441; --gold-l:#f0d9a8;
  --terra:#c05b2e; --terra-l:#f6e3d8; --line:#e5d9c3; --shadow:0 10px 30px rgba(36,26,18,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--bronze-d)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill-bronze{background:var(--gold-l);color:var(--bronze-d)}
.pill-terra{background:var(--terra-l);color:var(--terra)}
.pill-ink{background:var(--ink);color:#f6ead2}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1d130b,#2e1f10 55%,#4a2f14);color:#f6ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.hide{opacity:0;visibility:hidden}
#intro .coin{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6d789,#d9a441 55%,#8a5f16);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:46px;font-weight:700;color:#3a2708;box-shadow:0 0 0 8px rgba(217,164,65,.18),0 18px 44px rgba(0,0,0,.45);animation:coinIn 1s cubic-bezier(.2,.9,.3,1.2) both,coinFloat 3s ease-in-out 1s infinite}
@keyframes coinIn{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#intro h1{font-size:clamp(2.4rem,8vw,4rem);letter-spacing:.01em}
#intro h1 span{display:inline-block;opacity:0;animation:rise .7s ease forwards}
#intro h1 span:nth-child(1){animation-delay:.15s}#intro h1 span:nth-child(2){animation-delay:.25s}
#intro h1 span:nth-child(3){animation-delay:.35s}#intro h1 span:nth-child(4){animation-delay:.45s}
#intro h1 span:nth-child(5){animation-delay:.55s}#intro h1 span:nth-child(6){animation-delay:.65s}
#intro h1 span:nth-child(7){animation-delay:.75s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#intro p{opacity:0;animation:rise .7s .9s ease forwards;color:#e8d5ae;font-size:1.05rem;text-align:center;padding:0 24px}
#intro .bar{width:min(280px,70vw);height:4px;border-radius:99px;background:rgba(246,234,210,.2);overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#f6d789);animation:load 3.4s ease forwards}
@keyframes load{to{width:100%}}
#intro .skip{position:absolute;bottom:26px;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:#d9c49a;border:1px solid rgba(217,196,154,.5);padding:9px 18px;border-radius:999px;background:transparent}
#intro.quick .bar i{animation-duration:1s}
#intro.quick h1 span,#intro.quick p{animation-delay:0s}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:90;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#d9a441,#a4762a);color:#fffdf7;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:21px;box-shadow:0 4px 12px rgba(164,118,42,.35)}
.logo b{font-family:'Fraunces',serif;font-size:1.3rem}
.logo small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--ink2);font-weight:600;font-size:.88rem;padding:8px 11px;border-radius:999px}
nav a:hover{background:var(--paper2);color:var(--ink)}
.short-chip{margin-left:6px;background:var(--ink);color:#f6ead2;border:none;border-radius:999px;padding:8px 13px;font-weight:700;font-size:.85rem}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero-photo{position:relative;height:440px;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translateX(-1.5%)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,5,.15),rgba(20,12,5,.62) 78%)}
